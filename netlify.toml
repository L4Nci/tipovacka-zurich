[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[functions."billing-test-scheduled"]
  schedule = "*/10 * * * *"

[functions."billing-live-scheduled"]
  schedule = "5-59/10 * * * *"

[[redirects]]
  from = "/api/billing/live/*"
  to = "/.netlify/functions/billing-live/:splat"
  status = 200

[[redirects]]
  from = "/api/billing/test/*"
  to = "/.netlify/functions/billing-test/:splat"
  status = 200

[[redirects]]
  from = "/api/admin/sync-football-data"
  to = "/.netlify/functions/sync-football-data"
  status = 200

[[redirects]]
  from = "/api/admin/sync-results-dry-run"
  to = "/.netlify/functions/sync-results-dry-run"
  status = 200

[[redirects]]
  from = "/api/admin/sync-results"
  to = "/.netlify/functions/sync-results"
  status = 200

[[redirects]]
  from = "/api/admin/sync-fixtures-dry-run"
  to = "/.netlify/functions/sync-fixtures-dry-run"
  status = 200

[[redirects]]
  from = "/api/admin/sync-fixtures"
  to = "/.netlify/functions/sync-fixtures"
  status = 200

[[redirects]]
  from = "/api/admin/set-tournament-winner"
  to = "/.netlify/functions/set-tournament-winner"
  status = 200

[[redirects]]
  from = "/api/admin/match-result"
  to = "/.netlify/functions/match-result"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-not-found"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
